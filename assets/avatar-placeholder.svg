<svg xmlns="http://www.w3.org/2000/svg" width="420" height="560" viewBox="0 0 420 560" role="img" aria-label="ACME DevStudio">
  <rect width="420" height="560" fill="#0f0f0f"/>

  <!-- raster deco -->
  <g stroke="#1c1c1c" stroke-width="1">
    <line x1="0" y1="140" x2="420" y2="140"/>
    <line x1="0" y1="420" x2="420" y2="420"/>
    <line x1="140" y1="0" x2="140" y2="560"/>
    <line x1="280" y1="0" x2="280" y2="560"/>
  </g>

  <!-- accent frame -->
  <rect x="1.5" y="1.5" width="417" height="557" fill="none" stroke="#CC0000" stroke-width="3"/>

  <!-- monogram -->
  <text x="210" y="290" text-anchor="middle" font-family="'Bebas Neue', Impact, sans-serif" font-size="96" fill="#f2f2f2" letter-spacing="6">ACME</text>
  <line x1="120" y1="320" x2="300" y2="320" stroke="#CC0000" stroke-width="2"/>
  <text x="210" y="360" text-anchor="middle" font-family="'Bebas Neue', Impact, sans-serif" font-size="30" fill="#CC0000" letter-spacing="8">DEVSTUDIO</text>
</svg>
